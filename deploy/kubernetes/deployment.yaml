apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifiable-agent-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verifiable-agent-runtime
  template:
    metadata:
      labels:
        app: verifiable-agent-runtime
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: ghcr.io/example/verifiable-agent-runtime:0.1.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: verifiable-agent-runtime
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
