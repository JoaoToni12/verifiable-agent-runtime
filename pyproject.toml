[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-agent-runtime"
version = "0.1.0"
description = "A policy-gated runtime for auditable AI agent actions."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "João Gabriel Toni" }]
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[project.scripts]
agent-runtime = "verifiable_agent_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["verifiable_agent_runtime"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
